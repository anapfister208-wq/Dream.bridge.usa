<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Bridge USA 🇺🇲 | Plataforma de Inglês para Brasileiros</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }
        body {
            background-color: #f1f5f9;
            color: #0f172a;
            line-height: 1.6;
        }
        header {
            background: #0b1329;
            color: white;
            padding: 1.2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #f59e0b;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
        }
        .logo span {
            color: #f59e0b;
        }
        .btn-primary {
            background-color: #f59e0b;
            color: #0b1329;
            padding: 14px 28px;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        .btn-primary:hover {
            background-color: #d97706;
        }
        .hero {
            background: #0b1329;
            color: white;
            text-align: center;
            padding: 70px 20px;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        #welcome-section {
            text-align: center;
            background: white;
            padding: 50px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-top: 4px solid #f59e0b;
        }
        .login-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-top: 4px solid #0b1329;
            display: none;
        }
        .login-box input, .login-box select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
        }
        #course-area {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Dream Bridge <span>USA</span></div>
    </header>

    <section class="hero">
        <h1>Plataforma de Inglês para Brasileiros</h1>
        <p>Do Básico ao Avançado</p>
    </section>

    <div class="container">
        <!-- TELA 1: BOTÃO INICIAL -->
        <div id="welcome-section">
            <h2 style="color: #0b1329; margin-bottom: 15px;">Comece a sua jornada</h2>
            <p style="color: #64748b; margin-bottom: 25px;">Faça login e escolha o seu nível para iniciar os estudos.</p>
            <button class="btn-primary" onclick="mostrarLogin()">Começar curso</button>
        </div>

        <!-- TELA 2: LOGIN E NÍVEL -->
        <div class="login-box" id="login-box">
            <h2 style="color: #0b1329; margin-bottom: 15px; text-align: center;">Acessar Plataforma</h2>
            <form onsubmit="iniciarCurso(event)">
                <label style="font-weight: 600; font-size: 0.9rem;">Seu Nome</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
                
                <label style="font-weight: 600; font-size: 0.9rem;">E-mail</label>
                <input type="email" placeholder="seu@email.com" required>
                
                <label style="font-weight: 600; font-size: 0.9rem;">Nível de Inglês</label>
                <select id="nivel">
                    <option value="Básico (Nível 1)">Básico (Nível 1)</option>
                    <option value="Intermediário (Nível 2)">Intermediário (Nível 2)</option>
                    <option value="Avançado (Nível 3)">Avançado (Nível 3)</option>
                </select>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px;">Entrar no Curso</button>
            </form>
        </div>

        <!-- TELA 3: CURSO -->
        <div id="course-area">
            <h2 id="titulo-curso" style="color: #0b1329; margin-bottom: 15px;">Bem-vindo ao Curso!</h2>
            <p style="color: #475569;">Os blocos de estudo e questões do seu nível estão prontos. Vamos começar!</p>
        </div>
    </div>

    <script>
        function mostrarLogin() {
            document.getElementById('welcome-section').style.display = 'none';
            document.getElementById('login-box').style.display = 'block';
        }

        function iniciarCurso(event) {
            event.preventDefault();
            const nome = document.getElementById('nome').value;
            const nivel = document.getElementById('nivel').value;
            
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('course-area').style.display = 'block';
            document.getElementById('titulo-curso').innerText = 'Olá, ' + nome + '! Seu curso (' + nivel + ') está liberado.';
        }
    </script>

</body>
</html>
